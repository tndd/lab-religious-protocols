name: Kaggle Compute

on:
  push:
    branches: [main]
    paths:
      - "kaggle/RUN_REQUEST"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_ID: tan258/notebook5d1b15d1f5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Kaggle token
        shell: bash
        run: |
          if [ -z "${KAGGLE_API_TOKEN}" ]; then
            echo "KAGGLE_API_TOKEN repository secret is missing."
            exit 2
          fi

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Submit compute job
        run: kaggle kernels push -p kaggle

      - name: Wait for Kaggle
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 330); do
            STATUS="$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)"
            echo "[$i] $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|success'; then
              exit 0
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancelled|canceled'; then
              echo "Kaggle run failed."
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for Kaggle run."
          exit 1

      - name: Download Kaggle output
        run: |
          mkdir -p kaggle-output
          kaggle kernels output "$KERNEL_ID" -p kaggle-output -o
          find kaggle-output -maxdepth 3 -type f -print

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-results-${{ github.run_number }}
          path: kaggle-output/
          if-no-files-found: error
          retention-days: 30
